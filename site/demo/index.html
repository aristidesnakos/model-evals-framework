<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalPulse Demo Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Warm editorial canvas — tokens remapped so existing classes inherit the new register */
  --bg: #F4EEE2; --surface: #FBF8F1; --text: #1A1712; --muted: #5C5446;
  --border: #DAD1BF; --accent: #2563EB; --accent-light: #E4ECFB;
  --accent-dark: #1D4ED8; --paper-2: #ECE3D2;
  --ink-faint: #948B78; --panel: #15120E;
  --green: #2F7D4F; --amber: #B07A1E; --red: #B23A2E;
  --radius: 2px;
  --shadow: 0 1px 2px rgba(26,23,18,0.05);
  --font-display: "Libre Caslon Display", Georgia, serif;
  --font-serif: "Libre Caslon Text", Georgia, serif;
  --font-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
::selection { background: var(--accent); color: var(--bg); }
.demo-banner { background: var(--panel); color: rgba(244,238,226,0.8); text-align: center; padding: 10px 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; }
.demo-banner a { color: #93b4f5; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.demo-banner a:hover { color: #b9cdf8; }
header { background: rgba(244,238,226,0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(26,23,18,0.15); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
header h1 { font-family: var(--font-display); font-size: 24px; font-weight: 400; letter-spacing: -0.01em; }
header nav { display: flex; gap: 8px; margin-left: auto; }
header nav a, header nav button { padding: 7px 14px; border-radius: var(--radius); text-decoration: none; color: var(--muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; cursor: pointer; border: 1px solid var(--border); background: transparent; transition: all 0.15s; }
header nav a:hover, header nav button:hover { color: var(--accent); border-color: var(--accent); }
header nav a.active { color: var(--accent); background: var(--accent-light); border-color: var(--accent); }
#app { max-width: 1200px; margin: 28px auto; padding: 0 24px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-primary { border-left: 2px solid var(--accent); }
.card h2 { font-family: var(--font-serif); font-size: 17px; font-weight: 700; }

/* Section header: title left, inline legend right */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.section-header h2 { margin-bottom: 0; }

/* Inline legend */
.inline-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.inline-legend .key-item { display: flex; align-items: center; gap: 5px; }
.inline-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.inline-legend .dot-green { background: var(--green); }
.inline-legend .dot-amber { background: var(--amber); }
.inline-legend .dot-red { background: var(--red); }
.inline-legend .key-divider { color: var(--border); }

/* Hero stats */
.hero-stats { display: flex; margin: 16px 0 14px; border-top: 2px solid var(--text); border-bottom: 1px solid var(--border); }
.hero-stat { flex: 1; padding: 16px; text-align: center; border-right: 1px solid var(--border); }
.hero-stat:last-child { border-right: none; }
.hero-num { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1.0; font-variant-numeric: tabular-nums; }
.hero-num.score { font-family: var(--font-mono); font-weight: 500; }
.hero-label { display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin-top: 6px; }

/* Scale note */
.scale-note { font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0; text-transform: none; }

/* Min-max range under avg score */
.score-range-hint { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 1px; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 9px 10px; border-bottom: 2px solid var(--text); font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--accent-light); }
.score { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.score-high { color: var(--green); }
.score-mid { color: var(--amber); }
.score-low { color: var(--red); }

/* Heatmap cells */
.heatmap-cell { padding: 3px 7px; border-radius: 4px; font-weight: 600; font-size: 12px; display: inline-block; min-width: 34px; text-align: center; }

/* Category groups */
.category-group { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; margin-top: 4px; border-top: 1px solid var(--border); }
.category-group:first-child { border-top: none; padding-top: 4px; }
.category-group-stats { font-size: 12px; color: var(--muted); }

/* Badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius); font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid transparent; }
.badge-suite { background: transparent; color: var(--accent); border-color: rgba(37,99,235,0.35); }
.badge-cat { background: var(--paper-2, #ECE3D2); color: var(--muted); border-color: var(--border); }
.badge-mod { background: transparent; color: var(--muted); border-color: var(--border); }
.badge-mod-vision { background: transparent; color: var(--accent-dark, #1D4ED8); border-color: rgba(37,99,235,0.3); }
.badge-mod-text { background: transparent; color: var(--muted); border-color: var(--border); }

/* Category tabs (leaderboard selector) */
.cat-tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.cat-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.15s; min-width: 150px; }
.cat-tab:hover { border-color: var(--accent); }
.cat-tab.active { border-color: var(--accent); background: var(--accent-light); }
.cat-tab-mod { font-family: var(--font-mono); font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; padding: 1px 6px; border-radius: var(--radius); border: 1px solid var(--border); color: var(--muted); }
.cat-mod-vision { color: var(--accent); border-color: rgba(37,99,235,0.3); }
.cat-mod-text { color: var(--muted); }
.cat-tab-label { font-family: var(--font-serif); font-size: 15px; font-weight: 700; color: var(--text); }
.cat-tab-count { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
.cat-tab.active .cat-tab-label { color: var(--accent); }

/* Meta */
.meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meta span { display: flex; align-items: center; gap: 4px; }
.meta strong { color: var(--text); }

/* Score range bar */
.range-bar-wrap { display: flex; align-items: center; gap: 8px; }
.range-bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; min-width: 56px; position: relative; overflow: hidden; }
.range-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 3px; }
.range-text { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Dimension callout */
.dim-callout { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.dim-callout strong { color: var(--text); }

/* Winner badge */
.winner-badge { display: inline-block; padding: 1px 7px; border-radius: var(--radius); font-family: var(--font-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; background: transparent; color: var(--green); border: 1px solid rgba(47,125,79,0.4); margin-left: 6px; vertical-align: middle; }

/* Charts */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-container { position: relative; height: 280px; }
.scatter-container { position: relative; height: 440px; }

/* Calibration / methodology note */
.calibration-note { font-size: 12.5px; color: var(--muted); margin-top: 14px; padding: 12px 14px; background: var(--bg); border-radius: var(--radius); border-left: 2px solid var(--accent); line-height: 1.6; }
.calibration-note strong { color: var(--text); }

/* Leaderboard badges */
.badge-viable { background: transparent; color: var(--green); border-color: rgba(47,125,79,0.4); }
.badge-slow { background: transparent; color: var(--amber); border-color: rgba(176,122,30,0.4); }
.badge-fail { background: transparent; color: var(--red); border-color: rgba(178,58,46,0.4); }
.badge-runs { background: transparent; color: var(--muted); border-color: var(--border); }

/* Axis caption above scatter (helps non-technical readers) */
.scatter-caption { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }
.scatter-caption .up-right { color: var(--green); font-weight: 600; }

/* Collapsibles */
details { margin-bottom: 4px; }
details summary { padding: 10px 12px; cursor: pointer; border-radius: 6px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
details summary:hover { background: var(--accent-light); }
details[open] summary { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
details .detail-content { padding: 8px 0 4px; }
.summary-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); flex-shrink: 0; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--text); margin-bottom: 8px; }

/* Compare button */
.btn-compare { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; opacity: 0.5; pointer-events: none; }
.btn-compare.enabled { opacity: 1; pointer-events: auto; }
.btn-compare.enabled:hover { background: #2563eb; }
input[type=checkbox] { accent-color: var(--accent); }

/* Delta colors */
.delta-up { color: var(--green); font-weight: 600; }
.delta-down { color: var(--red); font-weight: 600; }
.delta-flat { color: var(--muted); }

@media (max-width: 768px) {
  .chart-row { grid-template-columns: 1fr; }
  .hero-stats { flex-wrap: wrap; }
  .hero-stat { min-width: 50%; }
}
</style>
</head>
<body>
<div class="demo-banner">
  This is a demo with illustrative, seeded data across text and vision eval categories. &nbsp;<a href="https://github.com/aristidesnakos/model-evals-framework" target="_blank">Install EvalPulse</a> to run evaluations against your own prompts and models.
</div>
<header>
  <h1>EvalPulse</h1>
  <nav>
    <a href="/" style="color:var(--muted);font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--border);padding:6px 14px;border-radius:6px;background:var(--surface)" onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">&larr; Back</a>
    <a href="#/" class="nav-link active" data-route="leaderboard">Leaderboard</a>
    <a href="#/runs" class="nav-link" data-route="runs">Runs</a>
    <button class="btn-compare" id="compareBtn" onclick="goCompare()">Compare Selected</button>
  </nav>
</header>
<div id="app"></div>

<script>
const cache = {};
const selected = new Set();

async function fetchList() {
  if (cache._list) return cache._list;
  const r = await fetch('/demo/data/index.json');
  cache._list = await r.json();
  return cache._list;
}

async function fetchReport(filename) {
  if (cache[filename]) return cache[filename];
  const r = await fetch('/demo/data/' + filename);
  cache[filename] = await r.json();
  return cache[filename];
}

function scoreClass(v) { return v >= 7 ? 'score-high' : v >= 5 ? 'score-mid' : 'score-low'; }
function fmtDate(runId) {
  if (!runId || runId.length < 15) return runId || '';
  return runId.slice(0,4)+'-'+runId.slice(4,6)+'-'+runId.slice(6,8)+' '+runId.slice(9,11)+':'+runId.slice(11,13)+' UTC';
}
function stdColor(v) { return v < 0.5 ? 'var(--green)' : v < 1.0 ? 'var(--amber)' : 'var(--red)'; }
function heatBg(v) { return v >= 7 ? '#dcfce7' : v >= 5 ? '#fef9c3' : '#fee2e2'; }
function heatFg(v) { return v >= 7 ? '#166534' : v >= 5 ? '#854d0e' : '#991b1b'; }

const COLORS = ['#2563EB','#2F7D4F','#B07A1E','#B23A2E','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const DIMS    = ['completeness','accuracy','format','domain_relevance','clarity'];
const DLABELS = ['Complete','Accuracy','Format','Domain','Clarity'];

function updateNav(route) {
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
}

function updateCompareBtn() {
  const btn = document.getElementById('compareBtn');
  btn.classList.toggle('enabled', selected.size >= 2);
  btn.textContent = selected.size >= 2 ? `Compare (${selected.size})` : 'Compare Selected';
}

function goCompare() {
  if (selected.size < 2) return;
  location.hash = '#/compare?' + [...selected].map(f => 'id=' + f).join('&');
}

function dimAverages(mr) {
  const out = {};
  DIMS.forEach(d => {
    const vals = mr.test_results.flatMap(t => t.runs).filter(r => r.scores && r.scores[d]);
    out[d] = vals.length ? +(vals.map(r => r.scores[d]).reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : 0;
  });
  return out;
}

function modelSummaries(data) {
  return data.results.map(mr => {
    const scores = mr.test_results.filter(t => t.avg_score > 0).map(t => t.avg_score);
    const lats = []; let tokens = 0; let cost = 0;
    mr.test_results.forEach(tr => tr.runs.forEach(r => {
      if (r.latency) lats.push(r.latency);
      tokens += (r.tokens?.input||0) + (r.tokens?.output||0);
      cost += r.cost || 0;
    }));
    const stds = mr.test_results.filter(t => t.std_dev > 0).map(t => t.std_dev);
    return {
      id: mr.model_id, name: mr.model_name,
      avg: scores.length ? +(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : 0,
      min: scores.length ? +Math.min(...scores).toFixed(1) : 0,
      max: scores.length ? +Math.max(...scores).toFixed(1) : 0,
      std: stds.length ? +(stds.reduce((a,b)=>a+b,0)/stds.length).toFixed(2) : 0,
      lat: lats.length ? +(lats.reduce((a,b)=>a+b,0)/lats.length).toFixed(1) : 0,
      cost: +cost.toFixed(4), tokens, errors: mr.errors,
      dims: dimAverages(mr)
    };
  }).sort((a,b) => b.avg - a.avg);
}

function fmtCost(v) {
  if (v >= 0.01) return '$' + v.toFixed(2);
  if (v >= 0.001) return '$' + v.toFixed(3);
  return '$' + v.toFixed(4);
}

function groupByCategory(testCases) {
  const map = new Map();
  testCases.forEach(tc => {
    const cat = tc.category || 'general';
    if (!map.has(cat)) map.set(cat, []);
    map.get(cat).push(tc);
  });
  return map;
}

// Production-viability latency cutoff (seconds). Kept in sync with build-time constant in scripts/generate_demo_data.py.
const PRODUCTION_LATENCY_CUTOFF = 15;

// Fetch the precomputed leaderboard. Materialized at build time by scripts/generate_demo_data.py.
async function fetchLeaderboard() {
  if (cache._leaderboard) return cache._leaderboard;
  const r = await fetch('/demo/data/leaderboard.json');
  cache._leaderboard = await r.json();
  return cache._leaderboard;
}

// --- RENDERERS ---

// Category tab state for the lmarena-style leaderboard selector.
let selectedCat = null;
function selectCat(k) { selectedCat = k; renderLeaderboard(); }

async function renderLeaderboard() {
  updateNav('leaderboard');
  const app = document.getElementById('app');
  const data = await fetchLeaderboard();
  let cats = data.categories || [];

  // Back-compat: a leaderboard.json without `categories` (older build) still
  // renders as a single quality category from the legacy aggregated fields.
  if (!cats.length && (data.aggregated || []).length) {
    cats = [{
      key: 'all', label: 'All Runs', modality: 'text', task_type: 'generation',
      metric_kind: 'quality', suites: [], reportCount: data.reportCount || 0,
      leaderboard: data.aggregated, calibration: data.calibration || [],
      testCaseCount: data.testCaseCount || 0,
    }];
  }
  if (!cats.length) {
    app.innerHTML = '<div class="empty-state"><h2>No reports yet</h2><p>Run an evaluation first:<br><code>python evalpulse.py --run-eval</code></p></div>';
    return;
  }
  if (!selectedCat || !cats.find(c => c.key === selectedCat)) selectedCat = cats[0].key;
  const cat = cats.find(c => c.key === selectedCat);

  // Category tab bar (modality · task) — pick the leaderboard for your task.
  const tabs = cats.map(c => `
    <button class="cat-tab ${c.key === selectedCat ? 'active' : ''}" onclick="selectCat('${c.key}')">
      <span class="cat-tab-mod cat-mod-${c.modality}">${c.modality === 'vision' ? 'Vision' : 'Text'}</span>
      <span class="cat-tab-label">${c.label.split(' · ')[1] || c.label}</span>
      <span class="cat-tab-count">${c.reportCount} run${c.reportCount > 1 ? 's' : ''}</span>
    </button>`).join('');
  app.innerHTML = `<div class="cat-tabs">${tabs}</div><div id="cat-body"></div>`;
  const body = document.getElementById('cat-body');

  if (cat.metric_kind === 'classification_gate') {
    renderGateCategory(body, cat);
  } else {
    renderQualityCategory(body, cat);
  }
}

function renderQualityCategory(app, cat) {
  const aggregated = cat.leaderboard || [];
  const calibration = cat.calibration || [];
  const reportCount = cat.reportCount || 0;
  const testCaseCount = cat.testCaseCount || 0;
  if (!aggregated.length) {
    app.innerHTML = '<div class="empty-state"><h2>No data in this category</h2></div>';
    return;
  }

  const viableCount = aggregated.filter(m => m.productionViable).length;
  const topScore    = aggregated[0].avg;

  // Hero
  let html = `<div class="card">
    <div class="meta">
      <span><strong>Suite${cat.suites.length > 1 ? 's' : ''}</strong> ${cat.suites.map(s => `<span class="badge badge-suite">${s}</span>`).join(' ')}</span>
      <span><strong>Runs aggregated</strong> ${reportCount}</span>
      <span><strong>Test cases</strong> ${testCaseCount}</span>
      <span><strong>Production cutoff</strong> &le;${PRODUCTION_LATENCY_CUTOFF}s latency</span>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><span class="hero-num">${aggregated.length}</span><span class="hero-label">Models Evaluated</span></div>
      <div class="hero-stat"><span class="hero-num score ${scoreClass(topScore)}">${topScore}</span><span class="hero-label">Top Score</span></div>
      <div class="hero-stat"><span class="hero-num" style="color:var(--green)">${viableCount}</span><span class="hero-label">Production Viable</span></div>
      <div class="hero-stat"><span class="hero-num" style="color:var(--red)">${aggregated.length - viableCount}</span><span class="hero-label">Too Slow</span></div>
    </div>
  </div>`;

  // Score vs Latency scatter — the headline chart
  html += `<div class="card card-primary">
    <div class="section-header">
      <h2>Quality vs Speed Trade-off</h2>
      <div class="inline-legend">
        <span class="key-item"><span class="dot dot-green"></span>&le;${PRODUCTION_LATENCY_CUTOFF}s Production viable</span>
        <span class="key-item"><span class="dot dot-amber"></span>15&ndash;60s Batch only</span>
        <span class="key-item"><span class="dot dot-red"></span>&gt;60s Research/Offline</span>
      </div>
    </div>
    <div class="scatter-container"><canvas id="scatter"></canvas></div>
    <p class="scatter-caption">Higher is better &middot; Left is faster &middot; <span class="up-right">Top-left quadrant wins</span></p>`;

  if (calibration.length) {
    const parts = calibration.map(c => `<strong>${c.name}</strong> (&Delta;${c.delta.toFixed(2)})`).join(', ');
    html += `<div class="calibration-note">
      <strong>Cross-run calibration.</strong> These models appeared in multiple runs: ${parts}.
      Small deltas (&lt;0.3) confirm the runs are methodologically comparable, so coalescing them into one leaderboard is defensible.
    </div>`;
  }
  html += `</div>`;

  // Cost vs Intelligence scatter
  html += `<div class="card card-primary">
    <div class="section-header">
      <h2>Cost vs Intelligence</h2>
      <div class="inline-legend">
        <span class="key-item"><span class="dot dot-green"></span>7\u201310 Strong</span>
        <span class="key-item"><span class="dot dot-amber"></span>5\u20136.9 Moderate</span>
        <span class="key-item"><span class="dot dot-red"></span>&lt;5 Weak</span>
      </div>
    </div>
    <div class="scatter-container"><canvas id="cost-scatter"></canvas></div>
    <p class="scatter-caption">Higher is smarter \u00b7 Left is cheaper \u00b7 <span class="up-right">Top-left wins</span></p>
  </div>`;

  // Unified leaderboard table
  html += `<div class="card">
    <div class="section-header">
      <h2>Unified Leaderboard</h2>
      <div class="inline-legend">Aggregated across ${reportCount} run${reportCount>1?'s':''} &middot; click a model row to dig in</div>
    </div>
    <table><thead><tr>
      <th>#</th>
      <th>Model</th>
      <th>Score <span class="scale-note">(1&ndash;10)</span></th>
      <th>Consistency</th>
      <th>Avg Latency</th>
      <th>Production</th>
      <th>Runs</th>
      <th>Cost</th>
    </tr></thead><tbody>`;
  aggregated.forEach((m, i) => {
    const viable = m.productionViable
      ? `<span class="badge badge-viable">Viable</span>`
      : m.lat <= 60
        ? `<span class="badge badge-slow">Batch only</span>`
        : `<span class="badge badge-fail">Too slow</span>`;
    html += `<tr>
      <td style="color:var(--muted);font-weight:500">${i+1}</td>
      <td style="font-weight:500">${m.name}</td>
      <td><span class="score ${scoreClass(m.avg)}">${m.avg.toFixed(1)}</span><span class="score-range-hint">${m.min}&ndash;${m.max} range</span></td>
      <td style="color:${stdColor(m.std)};font-weight:600">${m.std}</td>
      <td style="font-variant-numeric:tabular-nums">${m.lat}s</td>
      <td>${viable}</td>
      <td><span class="badge badge-runs">${m.runCount}&times;</span></td>
      <td style="font-variant-numeric:tabular-nums">${fmtCost(m.cost || 0)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;

  app.innerHTML = html;

  // --- Scatter plot ---
  const scores = aggregated.map(m => m.avg);
  const lats = aggregated.map(m => m.lat);
  const yMin = Math.max(0, Math.floor((Math.min(...scores) - 0.5) * 2) / 2);
  const yMax = Math.min(10, Math.ceil((Math.max(...scores) + 0.5) * 2) / 2);
  const xMax = Math.ceil((Math.max(...lats) + 10) / 10) * 10;

  const pointColor = m => m.lat <= PRODUCTION_LATENCY_CUTOFF ? '#2F7D4F' : m.lat <= 60 ? '#B07A1E' : '#B23A2E';

  // Custom plugin: draw model name next to each point and a "15s cutoff" annotation
  const scatterLabels = {
    id: 'scatterLabels',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const meta = chart.getDatasetMeta(0);
      if (!meta) return;

      // Model-name labels
      ctx.save();
      ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#1A1712';
      ctx.textBaseline = 'middle';
      meta.data.forEach((pt, i) => {
        const d = chart.data.datasets[0].data[i];
        if (!d || !pt) return;
        // Flip label to the left if we're within 110px of the right edge
        const rightSpace = chartArea.right - pt.x;
        if (rightSpace < 110) {
          ctx.textAlign = 'right';
          ctx.fillText(d.model, pt.x - 10, pt.y);
        } else {
          ctx.textAlign = 'left';
          ctx.fillText(d.model, pt.x + 10, pt.y);
        }
      });
      ctx.restore();

      // "15s Production cutoff" annotation
      const xPx = scales.x.getPixelForValue(PRODUCTION_LATENCY_CUTOFF);
      ctx.save();
      ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#B23A2E';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`${PRODUCTION_LATENCY_CUTOFF}s production cutoff`, xPx + 4, chartArea.top + 4);
      ctx.restore();
    }
  };

  new Chart(document.getElementById('scatter'), {
    type: 'scatter',
    plugins: [scatterLabels],
    data: {
      datasets: [
        {
          label: 'Models',
          data: aggregated.map(m => ({ x: m.lat, y: m.avg, model: m.name, viable: m.productionViable })),
          backgroundColor: aggregated.map(pointColor),
          borderColor: aggregated.map(pointColor),
          pointRadius: 8,
          pointHoverRadius: 11,
          pointBorderWidth: 2,
          pointBorderColor: '#FBF8F1',
        },
        {
          type: 'line',
          label: 'Cutoff',
          data: [{ x: PRODUCTION_LATENCY_CUTOFF, y: yMin }, { x: PRODUCTION_LATENCY_CUTOFF, y: yMax }],
          borderColor: '#B23A2E',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          showLine: true,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { right: 24, top: 8 } },
      scales: {
        x: {
          type: 'linear',
          title: { display: true, text: 'Avg Latency (seconds) \u2192 slower', font: { size: 12, weight: '600' }, color: '#5C5446' },
          min: 0,
          max: xMax,
          grid: { color: '#EAE0CE' },
          ticks: { stepSize: xMax > 100 ? 20 : 10, font: { size: 11 } }
        },
        y: {
          title: { display: true, text: 'Avg Score (1\u201310) \u2191 better', font: { size: 12, weight: '600' }, color: '#5C5446' },
          min: yMin,
          max: yMax,
          grid: { color: '#EAE0CE' },
          ticks: { stepSize: 0.5, font: { size: 11 } }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'Cutoff') return null;
              const d = ctx.raw;
              return `${d.model}: ${d.y.toFixed(1)}/10 at ${d.x}s`;
            }
          }
        }
      }
    }
  });

  // Cost vs Intelligence scatter
  const costData = aggregated.filter(m => m.cost > 0);
  if (costData.length) {
    const cScores = costData.map(m => m.avg);
    const cCosts = costData.map(m => m.cost);
    const cyMin = Math.max(0, Math.floor((Math.min(...cScores) - 0.5) * 2) / 2);
    const cyMax = Math.min(10, Math.ceil((Math.max(...cScores) + 0.5) * 2) / 2);
    const cxMax = +(Math.max(...cCosts) * 1.3).toFixed(4) || 0.01;

    const costPointColor = m => m.avg >= 7 ? '#2F7D4F' : m.avg >= 5 ? '#B07A1E' : '#B23A2E';

    const costScatterLabels = {
      id: 'costScatterLabels',
      afterDatasetsDraw(chart) {
        const { ctx, chartArea } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!meta) return;
        ctx.save();
        ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#1A1712';
        ctx.textBaseline = 'middle';
        meta.data.forEach((pt, i) => {
          const d = chart.data.datasets[0].data[i];
          if (!d || !pt) return;
          if (chartArea.right - pt.x < 110) {
            ctx.textAlign = 'right';
            ctx.fillText(d.model, pt.x - 10, pt.y);
          } else {
            ctx.textAlign = 'left';
            ctx.fillText(d.model, pt.x + 10, pt.y);
          }
        });
        ctx.restore();
      }
    };

    new Chart(document.getElementById('cost-scatter'), {
      type: 'scatter',
      plugins: [costScatterLabels],
      data: {
        datasets: [{
          label: 'Models',
          data: costData.map(m => ({ x: m.cost, y: m.avg, model: m.name })),
          backgroundColor: costData.map(costPointColor),
          borderColor: '#FBF8F1',
          pointRadius: 8,
          pointHoverRadius: 11,
          pointBorderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 24, top: 8 } },
        scales: {
          x: {
            type: 'linear', min: 0, max: cxMax,
            title: { display: true, text: 'Cost ($) \u2192 cheaper is better', font: { size: 12, weight: '600' }, color: '#5C5446' },
            grid: { color: '#EAE0CE' },
            ticks: { callback: v => '$' + v.toFixed(3) }
          },
          y: {
            min: cyMin, max: cyMax,
            title: { display: true, text: 'Avg Score (1\u201310) \u2191 better', font: { size: 12, weight: '600' }, color: '#5C5446' },
            grid: { color: '#EAE0CE' },
            ticks: { stepSize: 0.5 }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const d = ctx.raw;
                return d.model + ': ' + d.y.toFixed(1) + '/10 at ' + fmtCost(d.x);
              }
            }
          }
        }
      }
    });
  }
}

// --- Classification-gate category (vision safety) ---
function fmtRate(v) {
  return v == null ? '<span style="color:var(--muted)">&mdash;</span>' : (v * 100).toFixed(0) + '%';
}
// goodLow=true: lower value is better (error rates); false: higher is better (accuracy/precision).
function rateColor(v, goodLow) {
  if (v == null) return 'var(--muted)';
  const bad = goodLow ? v : 1 - v;
  return bad <= 0.05 ? 'var(--green)' : bad <= 0.2 ? 'var(--amber)' : 'var(--red)';
}

function renderGateCategory(app, cat) {
  const rows = cat.gate || [];
  if (!rows.length) { app.innerHTML = '<div class="empty-state"><h2>No gate data in this category</h2></div>'; return; }
  const n = rows.length;
  const avgAcc = rows.reduce((a, r) => a + (r.accuracy || 0), 0) / n;
  const bestRej = Math.min(...rows.map(r => r.good_reject_rate == null ? 1 : r.good_reject_rate));
  const unsafeMeasurable = rows.some(r => r.unsafe_total > 0);

  let html = `<div class="card">
    <div class="meta">
      <span><strong>Suite</strong> ${cat.suites.map(s => `<span class="badge badge-suite">${s}</span>`).join(' ')}</span>
      <span><strong>Task</strong> binary safety gate (pass / block)</span>
      <span><strong>Cases</strong> ${rows[0].n}/model</span>
      <span><strong>Positive class</strong> should_pass</span>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><span class="hero-num">${n}</span><span class="hero-label">Vision Models</span></div>
      <div class="hero-stat"><span class="hero-num">${(avgAcc * 100).toFixed(0)}%</span><span class="hero-label">Avg Accuracy</span></div>
      <div class="hero-stat"><span class="hero-num" style="color:var(--green)">${(bestRej * 100).toFixed(0)}%</span><span class="hero-label">Best Good-Reject</span></div>
      <div class="hero-stat"><span class="hero-num" style="color:var(--muted)">${unsafeMeasurable ? 'Yes' : '—'}</span><span class="hero-label">Unsafe-Pass Measurable</span></div>
    </div>
    <div class="calibration-note"><strong>SAFE-only set.</strong> ${cat.gateNote || ''}</div>
  </div>`;

  html += `<div class="card card-primary">
    <div class="section-header">
      <h2>Classification Accuracy</h2>
      <div class="inline-legend">Higher is better &middot; share of SAFE cases correctly passed &middot; over-rejection shown in the table below</div>
    </div>
    <div class="chart-container" style="height:${Math.max(180, n * 52)}px"><canvas id="gate-bar"></canvas></div>
  </div>`;

  html += `<div class="card">
    <div class="section-header">
      <h2>Classification Leaderboard</h2>
      <div class="inline-legend">Positive = should_pass &middot; refusals/malformed count as BLOCK</div>
    </div>
    <table><thead><tr>
      <th>#</th><th>Model</th><th>Accuracy</th>
      <th>Good-Reject <span class="scale-note">(FN/good)</span></th>
      <th>Unsafe-Pass <span class="scale-note">(FP/unsafe)</span></th>
      <th>Precision</th><th>Recall</th>
      <th>TP/TN/FP/FN</th><th>Latency</th><th>Cost</th>
    </tr></thead><tbody>`;
  rows.forEach((r, i) => {
    html += `<tr>
      <td style="color:var(--muted);font-weight:500">${i + 1}</td>
      <td style="font-weight:500">${r.name}</td>
      <td style="color:${rateColor(r.accuracy, false)};font-weight:600">${fmtRate(r.accuracy)}</td>
      <td style="color:${rateColor(r.good_reject_rate, true)};font-weight:600">${fmtRate(r.good_reject_rate)}</td>
      <td style="color:${r.unsafe_pass_rate == null ? 'var(--muted)' : rateColor(r.unsafe_pass_rate, true)};font-weight:600">${fmtRate(r.unsafe_pass_rate)}</td>
      <td>${fmtRate(r.precision)}</td>
      <td>${fmtRate(r.recall)}</td>
      <td style="font-variant-numeric:tabular-nums;color:var(--muted)">${r.tp}/${r.tn}/${r.fp}/${r.fn}</td>
      <td style="font-variant-numeric:tabular-nums">${r.lat}s</td>
      <td style="font-variant-numeric:tabular-nums">${fmtCost(r.cost || 0)}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  app.innerHTML = html;

  new Chart(document.getElementById('gate-bar'), {
    type: 'bar',
    data: {
      labels: rows.map(r => r.name),
      datasets: [{
        data: rows.map(r => +(((r.accuracy == null ? 0 : r.accuracy)) * 100).toFixed(1)),
        backgroundColor: rows.map(r => { const v = r.accuracy == null ? 0 : r.accuracy; return v >= 0.9 ? '#2F7D4F' : v >= 0.7 ? '#B07A1E' : '#B23A2E'; }),
        borderRadius: 4, barThickness: 28,
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      scales: {
        x: { min: 0, max: 100, grid: { color: '#EAE0CE' }, ticks: { callback: v => v + '%' } },
        y: { grid: { display: false } }
      },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw}% accuracy` } } }
    }
  });
}

async function renderRunsList() {

    app.innerHTML = '<div class="empty-state"><h2>No reports yet</h2><p>Run an evaluation first:<br><code>python evalpulse.py --run-eval</code></p></div>';

        ${r.modality ? `<span class="badge badge-mod badge-mod-${r.modality}">${r.modality === 'vision' ? 'vision' : 'text'}</span>` : ''}

      </td>
      <td style="text-align:center">${r.model_count}</td>
      <td>${r.top_model ? `<span class="score ${scoreClass(r.top_model.avg)}">${r.top_model.avg}</span> <span style="color:var(--muted);font-size:12px">${r.top_model.name}</span>` : '\u2014'}</td>
      <td>
        <div class="range-bar-wrap">
          <div class="range-bar-track"><div class="range-bar-fill" style="left:${leftPct}%;width:${widthPct}%;background:${fillColor}"></div></div>
          <span class="range-text">${min}\u2013${max}</span>
        </div>
      </td>

  app.innerHTML = `
  <div class="hero-stats">
    <div class="hero-stat"><span class="hero-num">${reports.length}</span><span class="hero-label">Runs</span></div>
    <div class="hero-stat"><span class="hero-num">${uniqueSuites}</span><span class="hero-label">Suites</span></div>
    <div class="hero-stat"><span class="hero-num">${totalModelEvals}</span><span class="hero-label">Model Evaluations</span></div>
  </div>
  <div class="card">
    <div class="section-header">
      <h2>Evaluation Runs</h2>
      <div class="inline-legend">Scores 1\u201310 \u00b7 dual LLM judges \u00b7 select rows to compare</div>
    </div>
    <table><thead><tr>
      <th width="30"></th>
      <th>Date</th><th>Suite</th>
      <th style="text-align:center">Models</th>
      <th>Leader <span class="scale-note">(1\u201310)</span></th>
      <th>Score Range</th>
    </tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function toggleSelect(cb) {
  if (cb.checked) selected.add(cb.dataset.file); else selected.delete(cb.dataset.file);
  updateCompareBtn();
}

async function renderRun(filename) {
  updateNav('');
  const app = document.getElementById('app');
  const data = await fetchReport(filename);
  if (data.error) { app.innerHTML = `<div class="card"><p>${data.error}</p></div>`; return; }

  const summaries = modelSummaries(data);
  const testCases = data.results.length > 0 ? data.results[0].test_results : [];
  const topScore  = summaries.length ? summaries[0].avg : 0;
  const avgStd    = summaries.length
    ? +(summaries.map(m=>m.std).reduce((a,b)=>a+b,0)/summaries.length).toFixed(2) : 0;

  // 1. Run header
  let html = `<div class="card">
    <div class="meta">
      <span><strong>Suite</strong> <span class="badge badge-suite">${data.suite_name}</span></span>
      <span><strong>Date</strong> ${fmtDate(data.run_id)}</span>
      <span><strong>Runs/test</strong> ${data.runs_per_test}</span>
      <span><strong>Judges</strong> ${(data.judge_models||[]).join(', ')}</span>
    </div>
    <div class="hero-stats">
      <div class="hero-stat"><span class="hero-num score ${scoreClass(topScore)}">${topScore}</span><span class="hero-label">Top Score</span></div>
      <div class="hero-stat"><span class="hero-num">${summaries.length}</span><span class="hero-label">Models</span></div>
      <div class="hero-stat"><span class="hero-num">${testCases.length}</span><span class="hero-label">Test Cases</span></div>
      <div class="hero-stat"><span class="hero-num" style="color:${stdColor(avgStd)}">${avgStd}</span><span class="hero-label">Avg Consistency</span></div>
    </div>
    <div class="inline-legend">
      <span class="key-item"><span class="dot dot-green"></span>7\u201310 Strong</span>
      <span class="key-item"><span class="dot dot-amber"></span>5\u20136.9 Moderate</span>
      <span class="key-item"><span class="dot dot-red"></span>&lt;5 Weak</span>
      <span class="key-divider">\u00b7</span>
      <span>Std Dev: lower = more consistent across runs</span>
    </div>
  </div>`;

  // 2. Leaderboard
  html += `<div class="card card-primary">
    <div class="section-header"><h2>Model Leaderboard</h2></div>
    <div class="chart-container" style="height:${Math.max(180, summaries.length*52)}px"><canvas id="leaderboard"></canvas></div>
    <table style="margin-top:16px"><thead><tr>
      <th>#</th><th>Model</th>
      <th>Score <span class="scale-note">(1\u201310)</span></th>
      <th>Consistency</th><th>Avg Latency</th><th>Cost</th><th>Errors</th>
    </tr></thead><tbody>`;
  summaries.forEach((m, i) => {
    html += `<tr>
      <td style="color:var(--muted);font-weight:500">${i+1}</td>
      <td style="font-weight:500">${m.name}</td>
      <td><span class="score ${scoreClass(m.avg)}">${m.avg}</span><span class="score-range-hint">${m.min}\u2013${m.max} range</span></td>
      <td style="color:${stdColor(m.std)};font-weight:600">${m.std}</td>
      <td>${m.lat}s</td>
      <td>${fmtCost(m.cost)}</td>
      <td>${m.errors > 0 ? `<span style="color:var(--red);font-weight:600">${m.errors}</span>` : '0'}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  // Cost vs Intelligence scatter
  html += `<div class="card card-primary">
    <div class="section-header">
      <h2>Cost vs Intelligence</h2>
      <div class="inline-legend">
        <span class="key-item"><span class="dot dot-green"></span>7\u201310 Strong</span>
        <span class="key-item"><span class="dot dot-amber"></span>5\u20136.9 Moderate</span>
        <span class="key-item"><span class="dot dot-red"></span>&lt;5 Weak</span>
      </div>
    </div>
    <div class="scatter-container"><canvas id="run-cost-scatter"></canvas></div>
    <p class="scatter-caption">Higher is smarter \u00b7 Left is cheaper \u00b7 <span class="up-right">Top-left wins</span></p>
  </div>`;

  // 3. Radar + Reliability
  html += `<div class="chart-row">
    <div class="card">
      <div class="section-header"><h2>Dimension Profiles</h2></div>
      <div class="chart-container"><canvas id="radar"></canvas></div>
    </div>
    <div class="card">
      <div class="section-header">
        <h2>Reliability</h2>
        <div class="inline-legend">
          <span class="key-item"><span class="dot dot-green"></span>&lt;0.5 Consistent</span>
          <span class="key-item"><span class="dot dot-amber"></span>0.5\u20131.0 Variable</span>
          <span class="key-item"><span class="dot dot-red"></span>\u22651.0 Unstable</span>
        </div>
      </div>
      <div class="chart-container"><canvas id="reliability"></canvas></div>
    </div>
  </div>`;

  // 4. Dimension heatmap
  const allDimAvgs = {};
  DIMS.forEach(d => {
    const vals = summaries.map(m => m.dims[d]).filter(v => v > 0);
    allDimAvgs[d] = vals.length ? +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : 0;
  });
  const sortedByAvg = [...DIMS].sort((a,b) => allDimAvgs[b] - allDimAvgs[a]);
  const strongest = sortedByAvg[0], weakest = sortedByAvg[sortedByAvg.length-1];

  html += `<div class="card"><div class="section-header"><h2>Dimension Breakdown</h2></div>
    <table><thead><tr>
      <th>Model</th>
      ${DLABELS.map(l => `<th style="text-align:center">${l}</th>`).join('')}
    </tr></thead><tbody>`;
  summaries.forEach(m => {
    html += `<tr><td style="font-weight:500">${m.name}</td>`;
    DIMS.forEach(d => {
      const v = m.dims[d];
      html += `<td style="text-align:center"><span class="heatmap-cell" style="background:${heatBg(v)};color:${heatFg(v)}">${v}</span></td>`;
    });
    html += '</tr>';
  });
  html += `</tbody></table>
    <p class="dim-callout"><strong>Strongest:</strong> ${strongest.replace('_',' ')} (${allDimAvgs[strongest]} avg)&emsp;<strong>Weakest:</strong> ${weakest.replace('_',' ')} (${allDimAvgs[weakest]} avg)</p>
  </div>`;

  // 5. Per-test-case grouped by category
  html += '<div class="card"><h2 style="margin-bottom:12px">Per-Test-Case Results</h2>';
  if (data.results.length > 0) {
    const byCategory = groupByCategory(testCases);
    byCategory.forEach((catTcs, category) => {
      const catScores = [];
      catTcs.forEach(tc => {
        data.results.forEach(mr => {
          const m = mr.test_results.find(t => t.test_case_id === tc.test_case_id);
          if (m && m.avg_score > 0) catScores.push(m.avg_score);
        });
      });
      const catAvg = catScores.length
        ? +(catScores.reduce((a,b)=>a+b,0)/catScores.length).toFixed(1) : 0;

      html += `<div class="category-group">
        <span class="badge badge-cat">${category}</span>
        <span class="category-group-stats">
          <span class="score ${scoreClass(catAvg)}" style="font-weight:600">${catAvg}</span>
          avg \u00b7 ${catTcs.length} test${catTcs.length > 1 ? 's' : ''}
        </span>
      </div>`;

      catTcs.forEach(tc => {
        const tcRows = [];
        data.results.forEach(mr => {
          const match = mr.test_results.find(t => t.test_case_id === tc.test_case_id);
          if (!match) return;
          const valid = match.runs.filter(r => r.scores);
          const dims = {};
          DIMS.forEach(d => {
            dims[d] = valid.length
              ? +(valid.map(r => r.scores[d]||0).reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : 0;
          });
          tcRows.push({ name: mr.model_name, avg: match.avg_score, std: match.std_dev, ...dims });
        });
        tcRows.sort((a,b) => b.avg - a.avg);
        const passCount = tcRows.filter(r => r.avg >= 7).length;

        const tcPrompt = tc.prompt || '';
        const tcRef = tc.reference_answer || '';
        html += `<details><summary>
          <span style="font-weight:500">${tc.test_case_name}</span>
          <span class="summary-right">
            <span>${passCount}/${tcRows.length} scored 7+</span>
            <span class="score ${scoreClass(tcRows[0]?.avg||0)}">${tcRows[0]?.avg||0}</span>
          </span>
        </summary>
        <div class="detail-content">`;
        if (tcPrompt) html += `<div style="margin-bottom:10px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px"><strong>Prompt:</strong> ${tcPrompt}</div>`;
        if (tcRef) html += `<div style="margin-bottom:10px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px"><strong>Expected:</strong> ${tcRef}</div>`;
        html += `<table><thead><tr>
          <th>Model</th>
          <th>Score <span class="scale-note">(1\u201310)</span></th>
          <th>Std Dev</th>
          ${DLABELS.map(l => `<th style="text-align:center">${l}</th>`).join('')}
        </tr></thead><tbody>`;
        tcRows.forEach(r => {
          html += `<tr>
            <td style="font-weight:500">${r.name}</td>
            <td><span class="score ${scoreClass(r.avg)}">${r.avg}</span></td>
            <td style="color:${stdColor(r.std)};font-weight:600">${r.std}</td>
            ${DIMS.map(d => `<td style="text-align:center"><span class="heatmap-cell" style="background:${heatBg(r[d])};color:${heatFg(r[d])}">${r[d]}</span></td>`).join('')}
          </tr>`;
        });
        html += '</tbody></table></div></details>';
      });
    });
  }
  html += '</div>';

  app.innerHTML = html;

  // Charts
  if (summaries.length > 0) {
    new Chart(document.getElementById('leaderboard'), {
      type: 'bar',
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        scales: {
          x: { min: 0, max: 10, grid: { color: '#EAE0CE' }, ticks: { stepSize: 2 } },
          y: { grid: { display: false } }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `${ctx.raw}/10  (range ${summaries[ctx.dataIndex].min}\u2013${summaries[ctx.dataIndex].max})` } }
        }
      },
      data: {
        labels: summaries.map(m => m.name),
        datasets: [{ data: summaries.map(m => m.avg),
          backgroundColor: summaries.map(m => m.avg>=7?'#2F7D4F':m.avg>=5?'#B07A1E':'#B23A2E'),
          borderRadius: 4, barThickness: 28 }]
      }
    });

    const radarDS = data.results.map((mr, i) => {
      const vals = DIMS.map(d => {
        const valid = mr.test_results.flatMap(t=>t.runs).filter(r=>r.scores);
        return valid.length ? +(valid.map(r=>r.scores[d]||0).reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : 0;
      });
      return { label: mr.model_name, data: vals,
        borderColor: COLORS[i%COLORS.length],
        backgroundColor: COLORS[i%COLORS.length]+'22',
        pointRadius: 3, borderWidth: 2 };
    });
    new Chart(document.getElementById('radar'), {
      type: 'radar',
      data: { labels: DLABELS, datasets: radarDS },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, font: { size: 10 } }, pointLabels: { font: { size: 11 } } } },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 }, padding: 10 } },
          tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.raw } }
        }
      }
    });

    new Chart(document.getElementById('reliability'), {
      type: 'bar',
      data: {
        labels: summaries.map(m => m.name),
        datasets: [{ data: summaries.map(m => m.std),
          backgroundColor: summaries.map(m => m.std<0.5?'#2F7D4F':m.std<1?'#B07A1E':'#B23A2E'),
          borderRadius: 4, barThickness: 28 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { min: 0, grid: { color: '#EAE0CE' } },
          x: { grid: { display: false } }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => 'Std Dev: ' + ctx.raw } }
        }
      }
    });

    // Cost vs Intelligence scatter (run detail)
    const rcCosts = summaries.map(m => m.cost);
    if (rcCosts.some(c => c > 0)) {
      const rcScores = summaries.map(m => m.avg);
      const rcyMin = Math.max(0, Math.floor((Math.min(...rcScores) - 0.5) * 2) / 2);
      const rcyMax = Math.min(10, Math.ceil((Math.max(...rcScores) + 0.5) * 2) / 2);
      const rcxMax = +(Math.max(...rcCosts) * 1.3).toFixed(4) || 0.01;
      const rcLabels = {
        id: 'rcLabels',
        afterDatasetsDraw(chart) {
          const { ctx, chartArea } = chart;
          const meta = chart.getDatasetMeta(0);
          if (!meta) return;
          ctx.save();
          ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = '#1A1712';
          ctx.textBaseline = 'middle';
          meta.data.forEach((pt, i) => {
            const d = chart.data.datasets[0].data[i];
            if (!d || !pt) return;
            if (chartArea.right - pt.x < 110) { ctx.textAlign = 'right'; ctx.fillText(d.model, pt.x - 10, pt.y); }
            else { ctx.textAlign = 'left'; ctx.fillText(d.model, pt.x + 10, pt.y); }
          });
          ctx.restore();
        }
      };
      new Chart(document.getElementById('run-cost-scatter'), {
        type: 'scatter',
        plugins: [rcLabels],
        data: {
          datasets: [{
            label: 'Models',
            data: summaries.map(m => ({ x: m.cost, y: m.avg, model: m.name })),
            backgroundColor: summaries.map(m => m.avg>=7?'#2F7D4F':m.avg>=5?'#B07A1E':'#B23A2E'),
            borderColor: '#FBF8F1', pointRadius: 8, pointHoverRadius: 11, pointBorderWidth: 2,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { right: 24, top: 8 } },
          scales: {
            x: { type: 'linear', min: 0, max: rcxMax,
              title: { display: true, text: 'Cost ($) \u2192 cheaper is better', font: { size: 12, weight: '600' }, color: '#5C5446' },
              grid: { color: '#EAE0CE' }, ticks: { callback: v => '$' + v.toFixed(3) } },
            y: { min: rcyMin, max: rcyMax,
              title: { display: true, text: 'Score (1\u201310) \u2191 better', font: { size: 12, weight: '600' }, color: '#5C5446' },
              grid: { color: '#EAE0CE' }, ticks: { stepSize: 0.5 } }
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => { const d = ctx.raw; return d.model + ': ' + d.y.toFixed(1) + '/10 at ' + fmtCost(d.x); } } }
          }
        }
      });
    }
  }
}

async function renderCompare() {
  updateNav('');
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  const ids = params.getAll('id');

  if (ids.length < 2) {
    app.innerHTML = '<div class="card"><p>Select at least 2 runs to compare.</p></div>';
    return;
  }

  const runs = await Promise.all(ids.map(id => fetchReport(id)));
  const validRuns = runs.filter(r => !r.error);

  if (validRuns.length < 2) {
    app.innerHTML = '<div class="card"><p>Could not load enough reports for comparison.</p></div>';
    return;
  }

  const allModels = new Map();
  validRuns.forEach((run, ri) => {
    run.results.forEach(mr => {
      if (!allModels.has(mr.model_id)) allModels.set(mr.model_id, { name: mr.model_name, scores: [] });
      const entry = allModels.get(mr.model_id);
      const scores = mr.test_results.filter(t=>t.avg_score>0).map(t=>t.avg_score);
      entry.scores[ri] = scores.length ? +(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : 0;
    });
  });

  let winnerId = null, bestDelta = -Infinity;
  allModels.forEach((info, id) => {
    const delta = (info.scores[info.scores.length-1]??0) - (info.scores[0]??0);
    if (delta > bestDelta) { bestDelta = delta; winnerId = id; }
  });

  let html = `<div class="card card-primary">
    <div class="section-header">
      <h2>Run Comparison</h2>
      <div class="inline-legend">
        ${validRuns.map((r,i) => `<span><strong>Run ${i+1}:</strong> ${fmtDate(r.run_id)} \u00b7 ${r.suite_name}</span>`).join('<span class="key-divider">\u00b7</span>')}
      </div>
    </div>
    <div class="chart-container" style="height:${Math.max(250, allModels.size*60)}px"><canvas id="compare-chart"></canvas></div>
  </div>`;

  html += `<div class="card">
    <div class="section-header">
      <h2>Score Changes</h2>
      <div class="inline-legend">Delta = last run minus first run</div>
    </div>
    <table><thead><tr><th>Model</th>`;
  validRuns.forEach((r,i) => { html += `<th>Run ${i+1} <span class="scale-note">(1\u201310)</span></th>`; });
  html += '<th>Delta</th></tr></thead><tbody>';

  allModels.forEach((info, modelId) => {
    const first = info.scores[0]??0, last = info.scores[info.scores.length-1]??0;
    const delta = +(last - first).toFixed(1);
    const cls   = delta > 0.1 ? 'delta-up' : delta < -0.1 ? 'delta-down' : 'delta-flat';
    const arrow = delta > 0.1 ? '&uarr;' : delta < -0.1 ? '&darr;' : '';
    const isWinner = modelId === winnerId && bestDelta > 0.1;
    html += `<tr><td style="font-weight:500">${info.name}${isWinner ? '<span class="winner-badge">Best</span>' : ''}</td>`;
    info.scores.forEach(s => { html += `<td class="score ${scoreClass(s||0)}">${s ?? '\u2014'}</td>`; });
    html += `<td class="${cls}">${arrow} ${delta > 0 ? '+' : ''}${delta}</td></tr>`;
  });
  html += '</tbody></table></div>';

  app.innerHTML = html;

  const labels   = [...allModels.keys()].map(id => allModels.get(id).name);
  const datasets = validRuns.map((run, i) => ({
    label: `Run ${i+1}: ${fmtDate(run.run_id).split(' ')[0]}`,
    data: [...allModels.keys()].map(id => allModels.get(id).scores[i]??0),
    backgroundColor: COLORS[i%COLORS.length]+'cc',
    borderRadius: 4, barThickness: 20,
  }));

  new Chart(document.getElementById('compare-chart'), {
    type: 'bar', data: { labels, datasets },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      scales: {
        x: { min: 0, max: 10, grid: { color: '#EAE0CE' }, ticks: { stepSize: 2 } },
        y: { grid: { display: false } }
      },
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 10, font: { size: 11 }, padding: 12 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.raw + '/10' } }
      }
    }
  });
}

// --- ROUTER ---
function route() {
  const hash = location.hash || '#/';
  if (hash.startsWith('#/run/')) {
    renderRun(hash.slice(6));
  } else if (hash.startsWith('#/runs')) {
    renderRunsList();
  } else if (hash.startsWith('#/compare')) {
    renderCompare();
  } else {
    renderLeaderboard();
  }
}

window.addEventListener('hashchange', route);
window.addEventListener('load', route);
</script>
